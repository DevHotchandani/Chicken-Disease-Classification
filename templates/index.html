<!DOCTYPE html>
<html>
<head>
    <title>Chicken Disease Classifier</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #ffe08a, transparent 35%),
                radial-gradient(circle at bottom right, #ffb347, transparent 35%),
                linear-gradient(135deg, #fff7d6, #ffd36e);
            overflow: hidden;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .page::before {
            content: "🐔 🐣 🥚 🐥 🐓";
            position: absolute;
            top: 40px;
            font-size: 48px;
            opacity: 0.18;
            animation: float 6s ease-in-out infinite;
        }

        .card {
            width: 430px;
            background: rgba(255, 255, 255, 0.88);
            padding: 35px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(120, 70, 0, 0.25);
            border: 3px solid #fff1b8;
        }

        .emoji {
            font-size: 70px;
            margin-bottom: 10px;
            animation: bounce 1.7s infinite;
        }

        h1 {
            color: #7a4200;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #6b4a1e;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .upload-box {
            display: block;
            padding: 22px;
            border: 2px dashed #d28b00;
            border-radius: 18px;
            background: #fff8df;
            cursor: pointer;
            margin-bottom: 22px;
            color: #7a4200;
            font-weight: bold;
        }

        .upload-box input {
            display: none;
        }

        button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff9f1c, #ffbf00);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 159, 28, 0.35);
        }

        button:hover {
            transform: translateY(-2px);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(18px); }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <div class="emoji">🐔</div>
            <h1>Chicken Disease Classifier</h1>
            <p class="subtitle">
                Upload a chicken fecal image and let the model check whether it looks healthy or affected by Coccidiosis.
            </p>

            <form action="/predict" method="post" enctype="multipart/form-data">
                <label class="upload-box">
                    <input type="file" name="image" accept="image/*" required>
                    <span>📸 Choose chicken sample image</span>
                </label>

                <button type="submit">Predict Now 🐣</button>
            </form>
        </div>
    </div>
</body>
</html>
